name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686

      - name: Build
        run: |
          rm -f 3ds-multinand.exe
          mkdir -p obj
          make CC=i686-w64-mingw32-gcc RC=i686-w64-mingw32-windres all debug

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-multinand
          path: |
            3ds-multinand.exe
            3ds-multinand_debug.exe
